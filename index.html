<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0f1115" />
<title>Untimed Arithmetic Drill</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#20242d; --text:#f3f4f6;
    --muted:#9ca3af; --border:#2f3542; --good:#39d98a; --bad:#ff6b6b;
    --accent:#7aa2f7; --shadow:0 16px 50px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at top, #171b24 0, var(--bg) 48%);
    color:var(--text); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  }
  .app{width:min(940px,94vw); padding:24px}
  .topbar{
    display:flex; gap:14px; align-items:center; justify-content:space-between; margin-bottom:18px;
  }
  h1{font-size:20px; margin:0; font-weight:700; letter-spacing:.2px}
  .sub{color:var(--muted); font-size:13px}
  .grid{display:grid; grid-template-columns:1fr 310px; gap:18px; margin-top:8px}
  .card{
    background:rgba(23,26,33,.96); border:1px solid var(--border);
    border-radius:18px; box-shadow:var(--shadow);
  }
  .main{padding:34px; min-height:470px; display:flex; flex-direction:column; justify-content:center}
  .question{
    text-align:center; font-size:clamp(42px,8vw,78px); font-weight:750; letter-spacing:-2px;
    margin:6px 0 22px;
  }
  .answer-wrap{display:flex; justify-content:center}
  input[type="text"]{
    width:min(390px,100%); font-size:34px; text-align:center; padding:15px 18px;
    background:#0d1015; color:var(--text); border:2px solid var(--border);
    border-radius:14px; outline:none;
  }
  input[type="text"]:focus{border-color:var(--accent)}
  input.good{border-color:var(--good)}
  input.bad{border-color:var(--bad)}
  .feedback{height:28px; text-align:center; margin-top:12px; font-weight:650}
  .feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
  .hint{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}
  .stats{
    margin-top:28px; display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
  }
  .stat{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
  .stat b{display:block;font-size:21px}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
  .side{padding:18px}
  .section{padding:8px 0 16px;border-bottom:1px solid var(--border)}
  .section:last-child{border-bottom:0}
  .section-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
  label.row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px;
  }
  .left{display:flex;align-items:center;gap:9px}
  input[type="checkbox"]{width:17px;height:17px}
  select,button{
    background:#0d1015;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 10px;
  }
  button{cursor:pointer}
  button:hover{border-color:#4b5563}
  .buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .wide{grid-column:1/-1}
  .tiny{font-size:12px;color:var(--muted);line-height:1.45}
  kbd{background:#0d1015;border:1px solid var(--border);border-bottom-width:2px;padding:2px 6px;border-radius:5px}
  @media(max-width:780px){
    .grid{grid-template-columns:1fr}
    .main{min-height:400px;padding:24px 18px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .side{order:2}
  }

  .mode-nav{
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    margin:0 0 14px;
  }
  .mode-nav a{
    text-decoration:none; color:var(--muted); background:var(--panel);
    border:1px solid var(--border); padding:8px 12px; border-radius:10px;
    font-size:13px; font-weight:650;
  }
  .mode-nav a.active{color:var(--text); border-color:var(--accent);}
  .mode-label{
    text-align:center; font-size:13px; color:var(--muted);
    margin-bottom:6px; text-transform:uppercase; letter-spacing:.8px;
  }
  .scorebar{
    display:flex; justify-content:center; gap:14px; margin-top:20px;
  }
  .scorebox{
    min-width:130px; background:var(--panel2); border:1px solid var(--border);
    border-radius:12px; padding:12px 16px; text-align:center;
  }
  .scorebox b{display:block;font-size:24px}
  .scorebox span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}


  .mode-picker{
    display:flex; justify-content:center; align-items:center; gap:10px;
    margin:0 0 14px;
  }
  .mode-picker label{
    font-size:12px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.8px; font-weight:650;
  }
  .mode-picker select{
    min-width:180px; font-size:14px; font-weight:650;
    padding:9px 34px 9px 12px;
  }
  .scorebar{
    display:flex; justify-content:center; gap:12px; margin-top:22px; flex-wrap:wrap;
  }
  .scorebox{
    min-width:130px; background:var(--panel2); border:1px solid var(--border);
    border-radius:12px; padding:12px 16px; text-align:center;
  }
  .scorebox b{display:block;font-size:24px}
  .scorebox span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
  .hidden{display:none !important}
  .review{padding:28px; margin-top:18px}
  .review h2{margin:0 0 8px;font-size:24px}
  .review-summary{color:var(--muted);margin-bottom:18px}
  .review-list{display:flex;flex-direction:column;gap:9px;max-height:65vh;overflow:auto}
  .review-entry{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:12px 14px;background:var(--panel2);border:1px solid var(--border);border-radius:10px}
  .review-entry .details{min-width:0;overflow-wrap:anywhere}
  .review-entry small{display:block;color:var(--muted);margin-top:5px}
  .review-entry .status{font-weight:700;white-space:nowrap}
  .review-entry .status.right{color:var(--good)}
  .review-entry .status.wrong{color:var(--bad)}
  .review-entry .status.skipped{color:var(--muted)}
  #homeBtn{margin-top:20px;padding:12px 20px;font-weight:700}
  .game-area.hidden{display:none !important}


  .time-settings{
    display:flex; justify-content:center; align-items:center; gap:10px;
    flex-wrap:wrap; margin:0 0 14px;
  }
  .time-settings label{
    font-size:12px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.8px; font-weight:650;
  }
  .time-settings select{
    min-width:130px; font-size:14px; font-weight:650;
    padding:9px 34px 9px 12px;
  }
  .minutes-input{
    width:110px; font-size:14px !important; text-align:center !important;
    padding:9px 10px !important; border-width:1px !important;
  }

  .fixed-time-controls{display:flex;align-items:center;gap:8px}
  .fixed-time-controls.hidden{display:none !important}
  #startTimerBtn{padding:9px 14px;font-weight:650}

  .easy-stats{
    margin-top:22px; display:grid; grid-template-columns:repeat(2,1fr); gap:10px;
  }
  .easy-stat{
    background:var(--panel2); border:1px solid var(--border);
    border-radius:12px; padding:12px; text-align:center;
  }
  .easy-stat b{display:block;font-size:21px}
  .easy-stat span{
    font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.7px;
  }
  @media(max-width:780px){
    .easy-stats{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="app">
  
  <div id="gameArea" class="game-area">
  <div class="mode-picker">
    <label for="modeSelect">Mode</label>
    <select id="modeSelect">
      <option value="easy">Easy</option>
      <option value="normal">Normal</option>
    </select>
  </div>

  <div class="time-settings">
    <label for="timeMode">Time</label>
    <select id="timeMode">
      <option value="unlimited">Unlimited</option>
      <option value="fixed">Fixed time</option>
    </select>

    <div id="fixedTimeControls" class="fixed-time-controls hidden">
      <input id="minutesInput" class="minutes-input" type="number"
             min="1" step="1" inputmode="numeric"
             placeholder="Minutes" aria-label="Minutes" />
      <button id="startTimerBtn" type="button">Start</button>
    </div>
  </div>

  <div class="grid">
    <section class="card main">
      <div id="question" class="question">12 × 7</div>
      <div class="answer-wrap">
        <input id="answer" type="text" inputmode="decimal" enterkeyhint="done" autocapitalize="off" spellcheck="false" autocomplete="off" aria-label="Answer" />
      </div>
      <div id="feedback" class="feedback"></div>
    
      <div id="easyStats" class="easy-stats">
        <div class="easy-stat"><b id="easyCorrect">0</b><span>Correct</span></div>
        <div class="easy-stat"><b id="easyTimer">∞</b><span>Time remaining</span></div>
      </div>

      <div id="scorebar" class="scorebar hidden">
        <div class="scorebox"><b id="score">0</b><span>Score</span></div>
        <div id="timerBox" class="scorebox"><b id="timer">∞</b><span>Time remaining</span></div>
      </div>
    </section>

    <aside class="card side">
      <div class="section">
        <div class="section-title">Question types</div>
        <label class="row"><span class="left"><input class="type" type="checkbox" value="add" checked> Addition</span></label>
        <label class="row"><span class="left"><input class="type" type="checkbox" value="sub" checked> Subtraction</span></label>
        <label class="row"><span class="left"><input class="type" type="checkbox" value="mul" checked> Multiplication</span></label>
        <label class="row"><span class="left"><input class="type" type="checkbox" value="div" checked> Division</span></label>
        <label class="row"><span class="left"><input class="type" type="checkbox" value="percent"> Percentages</span></label>
        <label class="row"><span class="left"><input class="type" type="checkbox" value="frac" checked> Fractions</span></label>
        <label class="row"><span class="left"><input class="type" type="checkbox" value="decimal" checked> Decimals</span></label>
      </div>

      <div class="section">
        <div class="section-title">Options</div>
        <label class="row"><span class="left"><input id="missing" type="checkbox"> Missing operand questions</span></label>
        <label class="row"><span class="left"><input id="allowNeg" type="checkbox" checked> Allow negative answers</span></label>
      </div>

      <div class="section">
        <div class="section-title">Controls</div>
        <div class="buttons">
          <button id="newBtn">New question</button>
          <button id="skipBtn">Skip</button>
          <button id="resetBtn" class="wide">Reset</button>
        </div>
      </div>

    </aside>
  </div>
  </div>
  <section id="reviewPage" class="card review hidden" aria-label="Timed session review">
    <h2>Session review</h2>
    <div id="reviewSummary" class="review-summary"></div>
    <div id="reviewList" class="review-list"></div>
    <button id="homeBtn" type="button">Return to home page</button>
  </section>
</div>

<script>
(() => {
  const gameAreaEl = document.getElementById('gameArea');
  const reviewPageEl = document.getElementById('reviewPage');
  const reviewListEl = document.getElementById('reviewList');
  const reviewSummaryEl = document.getElementById('reviewSummary');
  const homeBtn = document.getElementById('homeBtn');
  let sessionHistory = [];
  let questionId = 0;
  let sessionId = 0;
  let timerActive = false;
  let reviewShown = false;
  const htmlEscape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function recordQuestion(status, answerText){
    if(!timerActive || !current || current.recorded) return;
    sessionHistory.push({question:current.text, expected:formatExpected(current), given:answerText || '—', status});
    current.recorded = true;
  }
  function formatExpected(q){
    return q.displayAnswer !== undefined ? q.displayAnswer : String(Number(q.answer.toFixed(10)));
  }
  function showReview(){
    if(reviewShown) return;
    reviewShown = true;
    // Include the question visible when the countdown finished, if it was not completed.
    recordQuestion('unanswered', ansEl.value.trim());
    timerActive = false;
    gameAreaEl.classList.add('hidden');
    reviewPageEl.classList.remove('hidden');
    const right = sessionHistory.filter(q => q.status === 'correct').length;
    const wrong = sessionHistory.filter(q => q.status === 'incorrect').length;
    const other = sessionHistory.length-right-wrong;
    reviewSummaryEl.textContent = `${sessionHistory.length} questions · ${right} correct · ${wrong} incorrect · ${other} skipped/unanswered`;
    reviewListEl.innerHTML = '';
    sessionHistory.forEach((q,i) => {
      const entry = document.createElement('div');
      entry.className = 'review-entry';
      const details = document.createElement('div');
      details.className = 'details';
      const question = document.createElement('strong');
      question.textContent = `${i+1}. ${q.question}`;
      const answers = document.createElement('small');
      answers.textContent = `Your answer: ${q.given} · Correct answer: ${q.expected}`;
      details.append(question, answers);
      const status = document.createElement('span');
      status.className = 'status ' + (q.status==='correct'?'right':q.status==='incorrect'?'wrong':'skipped');
      status.textContent = ({correct:'Correct',incorrect:'Incorrect',skipped:'Skipped',unanswered:'Unanswered'})[q.status];
      entry.append(details,status);
      reviewListEl.append(entry);
    });
  }
  homeBtn.addEventListener('click', () => {
    reviewPageEl.classList.add('hidden');
    gameAreaEl.classList.remove('hidden');
    reviewShown = false;
    timerActive = false;
    sessionHistory = [];
    deadline = null;
    timeFinished = false;
    renderTimeSetting();
  });
  const qEl = document.getElementById('question');
  const ansEl = document.getElementById('answer');
  const feedbackEl = document.getElementById('feedback');
  const modeSelect = document.getElementById('modeSelect');
  const timeModeEl = document.getElementById('timeMode');
  const minutesInputEl = document.getElementById('minutesInput');
  const fixedTimeControlsEl = document.getElementById('fixedTimeControls');
  const startTimerBtn = document.getElementById('startTimerBtn');
  const scorebarEl = document.getElementById('scorebar');
  const easyStatsEl = document.getElementById('easyStats');
  const easyCorrectEl = document.getElementById('easyCorrect');
  const easyTimerEl = document.getElementById('easyTimer');
  let easyStats = {correct:0};
  const scoreEl = document.getElementById('score');
  const timerBoxEl = document.getElementById('timerBox');
  const timerEl = document.getElementById('timer');
  let mode = 'easy';
  let score = 0;
  let startedAt = null;
  let timerHandle = null;
  let deadline = null;
  let timeFinished = false;
  const missingEl = document.getElementById('missing');
  const allowNegEl = document.getElementById('allowNeg');

  let current = null;

  const ri = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  const chance = p => Math.random() < p;
  const gcd = (a,b) => b ? gcd(b,a%b) : Math.abs(a);

  function settings(){
    const checked = [...document.querySelectorAll('.type:checked')].map(x=>x.value);
    if (!checked.length){
      document.querySelector('.type[value="mul"]').checked = true;
      return {types:['mul']};
    }
    return {types:checked};
  }

  function signed(n, p=.28){
    return chance(p) ? -n : n;
  }

  function maybeMissing(a, op, b, result){
    if(!missingEl.checked || Math.random() > 0.20) return {text:`${a} ${op} ${b}`, answer:result};
    const left = Math.random() < .5;
    if(left) return {text:`? ${op} ${b} = ${result}`, answer:a};
    return {text:`${a} ${op} ? = ${result}`, answer:b};
  }

  // 80-in-8 style: mostly 2–3 digit arithmetic, some negatives, no toy-sized bias.
  function genAdd(){
    let a, b;
    const mode = Math.random();

    if(mode < .45){
      a = ri(120, 999);
      b = ri(20, 399);
    } else if(mode < .75){
      a = ri(20, 199);
      b = ri(20, 199);
    } else {
      a = ri(40, 999);
      b = ri(3, 99);
    }

    if(allowNegEl.checked){
      a = signed(a, .22);
      b = signed(b, .18);
    }
    return maybeMissing(a, '+', b, a+b);
  }

  function genSub(){
    let a, b;
    const mode = Math.random();

    if(mode < .50){
      a = ri(120, 999);
      b = ri(20, 499);
    } else if(mode < .80){
      a = ri(40, 299);
      b = ri(20, 199);
    } else {
      a = ri(20, 120);
      b = ri(3, 99);
    }

    if(allowNegEl.checked){
      a = signed(a, .28);
      b = signed(b, .16);
    } else if(b > a){
      [a,b] = [b,a];
    }
    return maybeMissing(a, '−', b, a-b);
  }

  function genMul(){
    const mode = Math.random();
    let a, b;

    if(mode < .42){
      // 2-digit × 2-digit, e.g. 13 × 56, 45 × 27, 50 × 56
      a = ri(11, 59);
      b = ri(12, 69);
    } else if(mode < .78){
      // 3-digit × 1-digit, e.g. 541 × 5, 905 × 9
      a = ri(101, 999);
      b = ri(3, 9);
    } else {
      // easier-looking but still realistic round-factor multiplication
      a = pick([20,25,30,40,50,60,75,80,90]);
      b = ri(12, 79);
    }

    if(allowNegEl.checked && chance(.16)) a = -a;
    return maybeMissing(a, '×', b, a*b);
  }

  function genDiv(){
    // Based on the reference recording: exact integer quotients, including
    // larger dividends and convenient divisors (e.g. 350 ÷ 25, 1080 ÷ 60).
    // Avoid non-integral quotients not observed in the reference sample.
    const style = Math.random();
    let divisor, quotient;
    if(style < .42){
      // Medium-size exact division with varied one- and two-digit divisors.
      divisor = pick([6,7,8,9,12,14,15,16,18,20,24,25,30,32,36]);
      quotient = ri(7, 35);
    } else if(style < .80){
      // Tidy divisions by multiples of 5, 10, 20, 25, etc.
      divisor = pick([10,12,15,20,25,30,40,50,60,75]);
      quotient = ri(8, 30);
    } else {
      // Larger but mentally tractable dividends.
      divisor = pick([12,15,20,24,25,30,40,50,60,75,80]);
      quotient = ri(12, 48);
    }
    const dividend = divisor * quotient * (allowNegEl.checked && chance(.14) ? -1 : 1);
    return maybeMissing(dividend, '÷', divisor, dividend/divisor);
  }

  function genDecimal(){
    // Decimal questions are addition/subtraction only.
    let a = chance(.50) ? ri(10,999)/10 : ri(20,99);
    let b = chance(.60) ? ri(100,999)/10 : ri(20,99);
    const op = chance(.52) ? '−' : '+';

    if(allowNegEl.checked && chance(.12)) a = -a;

    const answer = op === '+' ? a+b : a-b;
    return {text:`${a} ${op} ${b}`, answer};
  }

  function genPercent(){
    const p = pick([5,10,12.5,15,20,25,30,40,50,60,75]);
    const bases = p===12.5
      ? [40,48,56,64,72,80,96,120,160,240]
      : [20,30,40,50,60,80,100,120,150,160,200,240,300,400,500];
    const n = pick(bases);
    const answer = p*n/100;

    if(chance(.28)){
      return {text:`${answer} is ${p}% of ?`, answer:n};
    }
    return {text:`${p}% of ${n}`, answer};
  }

  function genFrac(){
    // Denominators observed are small; unreduced inputs are allowed on purpose.
    const denoms = [2,3,4,5,6,8,10,12];
    let d1 = pick(denoms);
    let d2 = pick(denoms);

    let n1 = ri(1, d1-1);
    let n2 = ri(1, d2-1);

    // Preserve unreduced-looking forms often, e.g. 3/6, 4/6, 2/12.
    if(chance(.34)){
      const forms = [[2,12],[3,6],[4,6],[3,12],[6,12],[2,8],[4,8]];
      [n1,d1] = pick(forms);
    }
    if(chance(.30)){
      const forms = [[2,12],[3,6],[4,6],[5,12],[6,12],[2,8],[4,8]];
      [n2,d2] = pick(forms);
    }

    if(allowNegEl.checked && chance(.18)) n1 = -n1;
    if(allowNegEl.checked && chance(.10)) n2 = -n2;

    const op = chance(.68) ? '−' : '+';
    const num = op==='+' ? n1*d2+n2*d1 : n1*d2-n2*d1;
    const den = d1*d2;
    const g = gcd(num, den);

    return {
      text:`${n1}/${d1} ${op} ${n2}/${d2}`,
      answer:(num/g)/(den/g),
      displayAnswer:(den/g)===1 ? `${num/g}` : `${num/g}/${den/g}`
    };
  }

  function newQuestion(){
    const s=settings(), type=pick(s.types);
    current =
      type==='add' ? genAdd() :
      type==='sub' ? genSub() :
      type==='mul' ? genMul() :
      type==='div' ? genDiv() :
      type==='percent' ? genPercent() :
      type==='frac' ? genFrac() :
      genDecimal();

    current.recorded = false;
    current.type = type;
    current.id = ++questionId;
    qEl.textContent=current.text;
    feedbackEl.textContent='';
    feedbackEl.className='feedback';
    ansEl.value='';
    ansEl.className='';
    ansEl.focus();
  }

  function parseAnswer(raw){
    const s=raw.trim().replace(/,/g,'');
    if(!s) return NaN;
    if(s.includes('/')){
      const parts=s.split('/');
      if(parts.length!==2) return NaN;
      const a=Number(parts[0]), b=Number(parts[1]);
      if(!Number.isFinite(a)||!Number.isFinite(b)||b===0) return NaN;
      return a/b;
    }
    if(s.endsWith('%')) return Number(s.slice(0,-1))/100;
    return Number(s);
  }


  function isCorrectAnswer(raw){
    const value = parseAnswer(raw);
    if(!Number.isFinite(value) || Math.abs(value-current.answer)>=1e-9) return false;
    // A fraction question only accepts a fraction in lowest terms (or an integer).
    if(current.type === 'frac'){
      const s = raw.trim().replace(/\s/g,'');
      if(s.includes('/')){
        const match = s.match(/^([+-]?\d+)\/([+-]?\d+)$/);
        if(!match) return false;
        const a = Number(match[1]), b = Number(match[2]);
        return b>1 && Number.isSafeInteger(a) && Number.isSafeInteger(b) && gcd(a,b)===1;
      }
      return /^[-+]?\d+$/.test(s) && Number.isInteger(current.answer);
    }
    return true;
  }

  let advancing = false;

  function stopTimer(){
    if(timerHandle){
      clearInterval(timerHandle);
      timerHandle = null;
    }
  }

  function selectedMinutes(){
    const n = Number(minutesInputEl.value);
    return Number.isInteger(n) && n > 0 ? n : null;
  }

  function renderTimeSetting(){
    sessionId++;
    advancing = false;
    const fixed = timeModeEl.value === 'fixed';
    fixedTimeControlsEl.classList.toggle('hidden', !fixed);

    stopTimer();
    timerActive = false;
    deadline = null;
    timeFinished = false;
    ansEl.disabled = false;

    score = 0;
    scoreEl.textContent = '0';

    easyStats = {correct:0};
    updateEasyStats();

    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
    ansEl.className = '';

    if(mode === 'normal'){
      timerEl.textContent = fixed ? '—' : '∞';
    } else if(mode === 'easy'){
      easyTimerEl.textContent = fixed ? '—' : '∞';
    }

    newQuestion();

    if(fixed){
      setTimeout(() => minutesInputEl.focus(), 0);
    }
  }

  function updateCountdown(){
    if(!deadline || reviewShown) return;

    const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));

    if(mode === 'normal'){
      timerEl.textContent = remaining;
    } else if(mode === 'easy'){
      easyTimerEl.textContent = remaining;
    }

    if(remaining <= 0 && !timeFinished){
      timeFinished = true;
      stopTimer();
      ansEl.disabled = true;
      feedbackEl.textContent = 'Time';
      feedbackEl.className = 'feedback';
      showReview();
    }
  }

  function startFixedTimer(){
    if(timeModeEl.value !== 'fixed') return;

    const mins = selectedMinutes();
    if(!mins){
      minutesInputEl.focus();
      return;
    }

    stopTimer();
    sessionId++;
    advancing = false;
    sessionHistory = [];
    timerActive = true;
    reviewShown = false;
    timeFinished = false;
    ansEl.disabled = false;

    if(mode === 'easy'){
      easyStats = {correct:0};
      updateEasyStats();
    } else {
      score = 0;
      scoreEl.textContent = '0';
    }

    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
    ansEl.className = '';

    deadline = Date.now() + mins * 60 * 1000;

    if(mode === 'normal'){
      timerEl.textContent = mins * 60;
    } else if(mode === 'easy'){
      easyTimerEl.textContent = mins * 60;
    }

    newQuestion();
    updateCountdown();
    timerHandle = setInterval(updateCountdown, 200);
    ansEl.focus();
  }

  function applyMode(){
    sessionId++;
    advancing = false;
    mode = modeSelect.value;

    stopTimer();
    timerActive = false;
    deadline = null;
    timeFinished = false;
    ansEl.disabled = false;

    score = 0;
    scoreEl.textContent = '0';

    easyStats = {correct:0};
    updateEasyStats();

    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
    ansEl.className = '';

    if(mode === 'easy'){
      easyStatsEl.classList.remove('hidden');
      scorebarEl.classList.add('hidden');
      easyTimerEl.textContent = timeModeEl.value === 'unlimited' ? '∞' : '—';
    } else {
      easyStatsEl.classList.add('hidden');
      scorebarEl.classList.remove('hidden');
      timerEl.textContent = timeModeEl.value === 'unlimited' ? '∞' : '—';
    }

    newQuestion();
  }

  function updateEasyStats(){
    easyCorrectEl.textContent = easyStats.correct;
  }

  function handleEasyInput(){
    if(mode !== 'easy' || advancing || timeFinished) return;

    const raw = ansEl.value.trim();
    if(!raw){
      feedbackEl.textContent='';
      feedbackEl.className='feedback';
      ansEl.className='';
      return;
    }

    const value = parseAnswer(raw);
    if(!Number.isFinite(value)) return;

    if(isCorrectAnswer(raw)){
      advancing = true;
      recordQuestion('correct',raw);
      easyStats.correct += 1;
      updateEasyStats();

      feedbackEl.textContent='Correct';
      feedbackEl.className='feedback good';
      ansEl.className='good';

      const id = sessionId;
      setTimeout(() => {
        if(!timeFinished && id === sessionId) newQuestion();
        advancing = false;
      }, 140);
    } else {
      feedbackEl.textContent='';
      feedbackEl.className='feedback';
      ansEl.className='';
    }
  }

  function submitNormal(){
    if(mode !== 'normal' || timeFinished || advancing) return;

    const raw = ansEl.value.trim();
    const value = parseAnswer(raw);
    if(!Number.isFinite(value)) return;

    advancing = true;
    if(isCorrectAnswer(raw)){
      recordQuestion('correct',raw);
      score += 1;
      scoreEl.textContent = score;
      feedbackEl.textContent = '+1';
      feedbackEl.className = 'feedback good';
      ansEl.className = 'good';
      const id = sessionId;
      setTimeout(() => { if(!timeFinished && id === sessionId) newQuestion(); advancing = false; }, 140);
    } else {
      recordQuestion('incorrect',raw);
      score -= 1;
      scoreEl.textContent = score;
      feedbackEl.textContent = '−1';
      feedbackEl.className = 'feedback bad';
      ansEl.className = 'bad';
      const id = sessionId;
      setTimeout(() => { if(!timeFinished && id === sessionId) newQuestion(); advancing = false; }, 140);
    }
  }

  ansEl.addEventListener('input', handleEasyInput);

  ansEl.addEventListener('keydown', e => {
    if(e.key === 'Enter' && mode === 'normal') submitNormal();
  });

  modeSelect.addEventListener('change', applyMode);

  timeModeEl.addEventListener('change', renderTimeSetting);

  startTimerBtn.addEventListener('click', startFixedTimer);

  minutesInputEl.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      e.preventDefault();
      startFixedTimer();
    }
  });

  function skipQuestion(){
    if(timeFinished || (timeModeEl.value==='fixed' && !timerActive)) return;
    recordQuestion('skipped',ansEl.value.trim());
    newQuestion();
  }
  document.getElementById('newBtn').onclick=skipQuestion;
  document.getElementById('skipBtn').onclick=skipQuestion;
  document.getElementById('resetBtn').onclick=()=>{
    sessionId++;
    advancing = false;
    timerActive = false;
    sessionHistory = [];
    if(mode === 'easy'){
      easyStats = {correct:0};
      updateEasyStats();
    } else {
      score = 0;
      scoreEl.textContent = '0';
    }

    feedbackEl.textContent = '';
    ansEl.disabled = false;
    timeFinished = false;

    if(timeModeEl.value === 'unlimited'){
      stopTimer();
      deadline = null;
      if(mode === 'normal'){
        timerEl.textContent = '∞';
      } else {
        easyTimerEl.textContent = '∞';
      }
    } else if(selectedMinutes()){
      startFixedTimer();
    } else {
      stopTimer();
      deadline = null;
      if(mode === 'normal'){
        timerEl.textContent = '—';
      } else {
        easyTimerEl.textContent = '—';
      }
    }

    newQuestion();
  };
  document.querySelectorAll('.type, #missing, #allowNeg').forEach(el=>{
    el.addEventListener('change', () => { if(!timeFinished) { recordQuestion('skipped',ansEl.value.trim()); newQuestion(); } });
  });
  updateEasyStats();
  renderTimeSetting();
  applyMode();
})();
</script>
</body>
</html>
